name: Lean CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject sorry and admit
        run: bash scripts/check_no_sorry.sh
      - uses: leanprover/lean-action@v1
        with:
          build: true
          nanoda: false
          nanoda-allow-sorry: false
